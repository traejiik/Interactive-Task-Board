<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>KANBANwa</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="header-container">
        <div class="nav-toolbar">
          <div class="task-counter">
            <div class="active-counter"></div>
            <div class="complete-counter"></div>
          </div>
          <div class="nav-button-container">
            <button class="theme-toggle btn-mute">
              <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
	<path d="M0 0h24v24H0z" fill="none" />
	<path fill="currentColor" d="M7.5 2c-1.79 1.15-3 3.18-3 5.5s1.21 4.35 3.03 5.5C4.46 13 2 10.54 2 7.5A5.5 5.5 0 0 1 7.5 2m11.57 1.5l1.43 1.43L4.93 20.5L3.5 19.07zm-6.18 2.43L11.41 5L9.97 6l.42-1.7L9 3.24l1.75-.12l.58-1.65L12 3.1l1.73.03l-1.35 1.13zm-3.3 3.61l-1.16-.73l-1.12.78l.34-1.32l-1.09-.83l1.36-.09l.45-1.29l.51 1.27l1.36.03l-1.05.87zM19 13.5a5.5 5.5 0 0 1-5.5 5.5c-1.22 0-2.35-.4-3.26-1.07l7.69-7.69c.67.91 1.07 2.04 1.07 3.26m-4.4 6.58l2.77-1.15l-.24 3.35zm4.33-2.7l1.15-2.77l2.2 2.54zm1.15-4.96l-1.14-2.78l3.34.24zM9.63 18.93l2.77 1.15l-2.53 2.19z" />
</svg>

            </button>
            <button class="create-task btn btn-primary">+</button>
          </div>
        </div>
        <div class="app-header">
          <h1>KANBANwa TaskBoard</h1>
          <p>Organise and track your project tasks efficiently.</p>
        </div>
      </header>

      <section class="controls-section">
        <!-- <form id="task-form" class="task-form">
        <input type="text" id="task-title" placeholder="Task title..." required />
        <select id="task-category" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Development">Development</option>
          <option value="Design">Design</option>
          <option value="Marketing">Marketing</option>
        </select>
        <select id="task-priority" required>
          <option value="" disabled selected>Select Priority</option>
          <option value="Low">Low Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
      </form> -->

        <div class="filter-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Search tasks..."
          />
          <select id="category-filter">
            <option value="All">All Categories</option>
            <option value="Development">Development</option>
            <option value="Design">Design</option>
            <option value="Marketing">Marketing</option>
          </select>
        </div>
        <div class="button-container">
          <button class="create-task btn btn-primary">Add Task</button>
        </div>
      </section>

      <!-- Kanban Columns -->
      <main class="board-container">
        <div
          class="column"
          data-status="todo"
        >
          <div class="column-header">
            <h2>To Do</h2>
            <span
              class="task-count"
              id="count-todo"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-todo"
            ></div>
            <div class="col-footer">
              <button
                id="list-td"
                class="btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>

        <div
          class="column"
          data-status="in-progress"
        >
          <div class="column-header">
            <h2>In Progress</h2>
            <span
              class="task-count"
              id="count-in-progress"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-in-progress"
            ></div>
            <div class="col-footer">
              <button
                id="list-ip"
                class="btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>

        <div
          class="column"
          data-status="completed"
        >
          <div class="column-header">
            <h2>Completed</h2>
            <span
              class="task-count"
              id="count-completed"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-completed"
            ></div>
            <div class="col-footer">
              <button
                id="list-cp"
                class="btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
