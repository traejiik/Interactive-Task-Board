<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>KANBANwa</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="header-container">
        <div class="nav-toolbar">
          <div class="task-counter">
            <div class="active-counter">Active <span class="active-content">0</span></div>
            <div class="complete-counter"><span class="complete-content">0</span> Completed</div>
          </div>
          <div class="nav-button-container">
            <button class="theme-toggle btn btn-mute">
              <div class="mdi--theme-light-dark"/>
            </button>
            <button class="create-task btn btn-primary">+</button>
          </div>
        </div>
        <div class="app-header">
          <h1>KANBANwa TaskBoard</h1>
          <p>Organise and track your project tasks efficiently.</p>
        </div>
      </header>

      <section class="controls-section">
        <!-- <form id="task-form" class="task-form">
        <input type="text" id="task-title" placeholder="Task title..." required />
        <select id="task-category" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Development">Development</option>
          <option value="Design">Design</option>
          <option value="Marketing">Marketing</option>
        </select>
        <select id="task-priority" required>
          <option value="" disabled selected>Select Priority</option>
          <option value="Low">Low Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
      </form> -->

        <div class="filter-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Search tasks..."
          />
          <select id="category-filter">
            <option value="All">All Categories</option>
            <option value="Development">Development</option>
            <option value="Design">Design</option>
            <option value="Marketing">Marketing</option>
          </select>
        </div>
        <div class="button-container">
          <button class="create-task btn btn-primary">Add Task</button>
        </div>
      </section>

      <!-- Kanban Columns -->
      <main class="board-container">
        <div
          class="column"
          data-status="todo"
        >
          <div class="column-header">
            <h2>To Do</h2>
            <span
              class="task-count"
              id="count-todo"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-todo"
            ></div>
            <div class="col-footer">
              <button
                id="list-td"
                class="btn btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>

        <div
          class="column"
          data-status="in-progress"
        >
          <div class="column-header">
            <h2>In Progress</h2>
            <span
              class="task-count"
              id="count-in-progress"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-in-progress"
            ></div>
            <div class="col-footer">
              <button
                id="list-ip"
                class="btn btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>

        <div
          class="column"
          data-status="completed"
        >
          <div class="column-header">
            <h2>Completed</h2>
            <span
              class="task-count"
              id="count-completed"
              >0</span
            >
          </div>
          <div class="col-content">
            <div
              class="task-list"
              id="list-completed"
            ></div>
            <div class="col-footer">
              <button
                id="list-cp"
                class="btn btn-mute"
              >
                + Create Task
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
